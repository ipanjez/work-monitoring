services:
  - type: web
    name: work-monitoring
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npx prisma db push && node prisma/seed.js && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: work-monitoring-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false

databases:
  - name: work-monitoring-db
    plan: free
    region: singapore
    databaseName: workmonitoring
    user: workuser
